apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: prathmeshawate/auth_service6
        command: ["python3", "backend/api/auth-service/auth_service.py"]
        ports:
        - containerPort: 8001
        env:
        - name: REDIS_HOST
          value: redis