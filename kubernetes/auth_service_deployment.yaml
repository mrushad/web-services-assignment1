apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: mrushad/web-services-assignment1-auth_service:latest
        ports:
        - containerPort: 8001
        env:
        - name: REDIS_HOST
          value: redis-service